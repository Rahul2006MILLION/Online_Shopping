# Render Blueprint for the BASKET backend (FastAPI) and its PostgreSQL database.
# The Next.js frontend is deployed separately on Vercel and reaches this API
# through its same-origin proxy (BASKET_API_PROXY_TARGET), so browser cookies
# stay first-party on the Vercel domain.
#
# Secrets marked `sync: false` are entered in the Render dashboard when the
# Blueprint is applied; they are never stored in this repository.

databases:
  - name: basket-db
    plan: free
    region: singapore
    databaseName: basket
    user: basket
    postgresMajorVersion: "16"

services:
  - type: web
    name: basket-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      # Sandbox / staging: Razorpay TEST mode only. Setting this to "production"
      # makes the app require rzp_live_ keys and is deliberately not done here.
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: basket-db
          property: connectionString
      # Render's internal network; the private URL does not use TLS.
      - key: DATABASE_SSL_MODE
        value: disable
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: DATABASE_MAX_OVERFLOW
        value: "5"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CSRF_SECRET_KEY
        generateValue: true
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      # Vercel edge + Render router sit in front of the API.
      - key: TRUSTED_PROXY_COUNT
        value: "2"
      - key: CORS_ORIGINS
        sync: false
      # No Kafka / OpenSearch in this deployment: deliver outbox events
      # in-process and use PostgreSQL full-text search.
      - key: OUTBOX_DISPATCH
        value: direct
      - key: KAFKA_BOOTSTRAP_SERVERS
        value: ""
      - key: OPENSEARCH_URL
        value: ""
      - key: SEED_DEMO_DATA
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
